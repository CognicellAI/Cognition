site_name: Cognition
site_description: Batteries-included backend for production AI agents
site_url: https://cognition.cognicellai.com/docs/
repo_name: CognicellAI/Cognition
repo_url: https://github.com/CognicellAI/Cognition
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site/docs
strict: true
exclude_docs: |
  README.md
  learn/**

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Sessions & Messages: concepts/sessions-and-messages.md
      - Agent Runtime: concepts/agent-runtime.md
      - Storage & Execution: concepts/storage-and-execution.md
      - Kubernetes Sandbox: concepts/kubernetes-sandbox.md
      - Observability: concepts/observability.md
      - Security: concepts/security.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Core vs App Layer: guides/core-vs-app-layer.md
      - Configuration: guides/configuration.md
      - Extending Agents: guides/extending-agents.md
      - Deployment: guides/deployment.md
      - API Reference: guides/api-reference.md
      - Release Checklist: guides/release-checklist.md
  - Blueprints:
      - Cognition CLI: blueprints/cognition-cli.md
      - BreachLens: blueprints/cyber-investigation.md
      - GeneSmith: blueprints/genesmith.md
      - DataLens: blueprints/data-analyst.md
      - StarKeep: blueprints/starkeep.md
      - ZeroOne: blueprints/zeroone.md
