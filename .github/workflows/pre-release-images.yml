name: Pre-Release Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (for example 0.8.3)"
        required: true
      prerelease_tag:
        description: "Temporary container tag suffix (for example rc1)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cognicellai/cognition

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Run type checking
        run: uv run mypy .

      - name: Run linting
        run: uv run ruff check .

      - name: Check out official A2A TCK
        if: matrix.python-version == '3.12'
        uses: actions/checkout@v4
        with:
          repository: a2aproject/a2a-tck
          # Keep this SHA synchronized with the normal CI conformance gate.
          ref: 5996b79f9cefa6fc390980e383e358a66fb9e49e
          path: .a2a-tck

      - name: Install official A2A TCK
        if: matrix.python-version == '3.12'
        run: uv sync --project .a2a-tck

      - name: Start Cognition A2A conformance fixture
        if: matrix.python-version == '3.12'
        run: |
          nohup uv run uvicorn tests.support.a2a_tck_sut:create_app \
            --factory --host 127.0.0.1 --port 9999 \
            > /tmp/cognition-a2a-tck.log 2>&1 &
          echo $! > /tmp/cognition-a2a-tck.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:9999/.well-known/agent-card.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cognition-a2a-tck.log
          exit 1

      - name: Run official A2A 1.0 JSON-RPC TCK
        if: matrix.python-version == '3.12'
        working-directory: .a2a-tck
        run: uv run python run_tck.py --sut-host http://127.0.0.1:9999 --transport jsonrpc

      - name: Stop Cognition A2A conformance fixture
        if: ${{ matrix.python-version == '3.12' && always() }}
        run: |
          if test -f /tmp/cognition-a2a-tck.pid; then
            kill "$(cat /tmp/cognition-a2a-tck.pid)" || true
          fi

      - name: Upload A2A conformance evidence
        if: ${{ matrix.python-version == '3.12' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-a2a-jsonrpc-tck-python-${{ matrix.python-version }}
          path: |
            .a2a-tck/reports/
            /tmp/cognition-a2a-tck.log
          if-no-files-found: warn

  build-amd64-app:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}-amd64
          cache-from: type=gha,scope=cognition-amd64
          cache-to: type=gha,mode=max,scope=cognition-amd64
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=v${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}

  build-amd64-sandbox:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox:${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}-amd64
          cache-from: type=gha,scope=cognition-sandbox-amd64
          cache-to: type=gha,mode=max,scope=cognition-sandbox-amd64
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=v${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}

  build-arm64-app:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}-arm64
          cache-from: type=gha,scope=cognition-arm64
          cache-to: type=gha,mode=max,scope=cognition-arm64
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=v${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}

  build-arm64-sandbox:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox:${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}-arm64
          cache-from: type=gha,scope=cognition-sandbox-arm64
          cache-to: type=gha,mode=max,scope=cognition-sandbox-arm64
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=v${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}

  merge-manifests-app:
    needs: [build-amd64-app, build-arm64-app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create app pre-release manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}"
          AMD64="${IMAGE}:${TAG}-amd64"
          ARM64="${IMAGE}:${TAG}-arm64"

          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "$AMD64" "$ARM64"

  merge-manifests-sandbox:
    needs: [build-amd64-sandbox, build-arm64-sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create sandbox pre-release manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox"
          TAG="${{ github.event.inputs.version }}-${{ github.event.inputs.prerelease_tag }}"
          AMD64="${IMAGE}:${TAG}-amd64"
          ARM64="${IMAGE}:${TAG}-arm64"

          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "$AMD64" "$ARM64"
