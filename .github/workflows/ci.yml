name: CI/CD

on:
  push:
    branches: [main, pivot, "release/**"]
  pull_request:
    branches: [main, pivot, "release/**"]
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  # Must be lowercase — GHCR rejects mixed-case image names
  IMAGE_NAME: cognicellai/cognition

jobs:
  # ─── Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Run type checking
        run: uv run mypy .

      - name: Run linting
        run: uv run ruff check .

      - name: Check out official A2A TCK
        if: matrix.python-version == '3.12'
        uses: actions/checkout@v4
        with:
          repository: a2aproject/a2a-tck
          # Pinned for reproducible A2A 1.0 JSON-RPC conformance. Update this
          # SHA deliberately when adopting a newer official TCK revision.
          ref: 5996b79f9cefa6fc390980e383e358a66fb9e49e
          path: .a2a-tck

      - name: Install official A2A TCK
        if: matrix.python-version == '3.12'
        run: uv sync --project .a2a-tck

      - name: Start Cognition A2A conformance fixture
        if: matrix.python-version == '3.12'
        run: |
          nohup uv run uvicorn tests.support.a2a_tck_sut:create_app \
            --factory --host 127.0.0.1 --port 9999 \
            > /tmp/cognition-a2a-tck.log 2>&1 &
          echo $! > /tmp/cognition-a2a-tck.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:9999/.well-known/agent-card.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cognition-a2a-tck.log
          exit 1

      - name: Run official A2A 1.0 JSON-RPC TCK
        if: matrix.python-version == '3.12'
        working-directory: .a2a-tck
        run: uv run python run_tck.py --sut-host http://127.0.0.1:9999 --transport jsonrpc

      - name: Stop Cognition A2A conformance fixture
        if: ${{ matrix.python-version == '3.12' && always() }}
        run: |
          if test -f /tmp/cognition-a2a-tck.pid; then
            kill "$(cat /tmp/cognition-a2a-tck.pid)" || true
          fi

      - name: Upload A2A conformance evidence
        if: ${{ matrix.python-version == '3.12' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a2a-jsonrpc-tck-python-${{ matrix.python-version }}
          path: |
            .a2a-tck/reports/
            /tmp/cognition-a2a-tck.log
          if-no-files-found: warn

  # ─── Cache warm-up (every push to main) ───────────────────────────────────
  # Builds without pushing on every push to main so that layer caches are
  # warm when a release fires. Scoped per-image to avoid eviction conflicts.
  warm-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: ./Dockerfile
            scope: cognition-amd64
          - dockerfile: ./Dockerfile.sandbox
            scope: cognition-sandbox-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Warm layer cache for ${{ matrix.scope }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  # ─── Build amd64 app image (native x86 runner) ────────────────────────────
  build-amd64-app:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64
          cache-from: type=gha,scope=cognition-amd64
          cache-to: type=gha,mode=max,scope=cognition-amd64
          build-args: |
            BUILD_DATE=${{ github.event.release.created_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.release.tag_name }}

  # ─── Build amd64 sandbox image (native x86 runner) ────────────────────────
  build-amd64-sandbox:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox:${{ github.sha }}-amd64
          cache-from: type=gha,scope=cognition-sandbox-amd64
          cache-to: type=gha,mode=max,scope=cognition-sandbox-amd64
          build-args: |
            BUILD_DATE=${{ github.event.release.created_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.release.tag_name }}

  # ─── Build arm64 app image (native ARM runner — no QEMU) ──────────────────
  build-arm64-app:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04-arm  # Native ARM64 — eliminates QEMU emulation overhead
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          cache-from: type=gha,scope=cognition-arm64
          cache-to: type=gha,mode=max,scope=cognition-arm64
          build-args: |
            BUILD_DATE=${{ github.event.release.created_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.release.tag_name }}

  # ─── Build arm64 sandbox image (native ARM runner — no QEMU) ──────────────
  build-arm64-sandbox:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04-arm  # Native ARM64 — eliminates QEMU emulation overhead
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox:${{ github.sha }}-arm64
          cache-from: type=gha,scope=cognition-sandbox-arm64
          cache-to: type=gha,mode=max,scope=cognition-sandbox-arm64
          build-args: |
            BUILD_DATE=${{ github.event.release.created_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.release.tag_name }}

  # ─── Merge amd64 + arm64 into final multi-arch app manifest ────────────────
  merge-manifests-app:
    needs: [build-amd64-app, build-arm64-app]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Create multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          AMD64="${IMAGE}:${{ github.sha }}-amd64"
          ARM64="${IMAGE}:${{ github.sha }}-arm64"

          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | awk '{print "-t " $0}' | tr '\n' ' ')

          docker buildx imagetools create $TAGS "$AMD64" "$ARM64"

  # ─── Merge amd64 + arm64 into final multi-arch sandbox manifest ────────────
  merge-manifests-sandbox:
    needs: [build-amd64-sandbox, build-arm64-sandbox]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Create multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox"
          AMD64="${IMAGE}:${{ github.sha }}-amd64"
          ARM64="${IMAGE}:${{ github.sha }}-arm64"

          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | awk '{print "-t " $0}' | tr '\n' ' ')

          docker buildx imagetools create $TAGS "$AMD64" "$ARM64"
