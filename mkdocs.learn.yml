site_name: Cognition Learn
site_description: Agent development curriculum using Cognition as the exercise backend
site_url: https://cognition.cognicellai.com/learn/
repo_name: CognicellAI/Cognition
repo_url: https://github.com/CognicellAI/Cognition
edit_uri: edit/main/docs/learn/
docs_dir: docs/learn
site_dir: site/learn
strict: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Overview: index.md
  - Lesson template: lesson-template.md
  - Foundations: foundations/index.md
  - Core: core/index.md
  - Production: production/index.md
  - Labs: labs/index.md
