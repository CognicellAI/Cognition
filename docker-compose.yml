# Docker Compose for Cognition with Full Observability Stack
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove volumes
#
# Services:
#   - cognition:       FastAPI server (port 8000)
#   - postgres:        PostgreSQL database (port 5432)
#   - mlflow:          MLflow tracking server (port 5000)
#   - prometheus:      Metrics collection (port 9091)
#   - grafana:         Dashboards (port 3000)
#   - otel-collector:  OpenTelemetry trace collector
#   - loki:            Log aggregation
#   - promtail:        Log shipping

services:
  # ──────────────────────────────────────────────────────
  # Layer 2: Persistence
  # ──────────────────────────────────────────────────────

  # PostgreSQL - Primary persistence backend
  postgres:
    image: postgres:16-alpine
    container_name: cognition-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cognition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cognition}
      POSTGRES_DB: ${POSTGRES_DB:-cognition}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cognition-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognition}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Layer 4: Agent Runtime (Cognition Server)
  # ──────────────────────────────────────────────────────

  # Cognition Server
  cognition:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognition-server
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      # Server
      - COGNITION_HOST=0.0.0.0
      - COGNITION_PORT=8000
      - COGNITION_LOG_LEVEL=info
      - COGNITION_LOG_FORMAT=json
      - COGNITION_WORKSPACE_ROOT=/workspace
      - COGNITION_METRICS_ENABLED=true
      - COGNITION_METRICS_PORT=9090

      # LLM Provider
      - COGNITION_LLM_PROVIDER=openai_compatible
      - COGNITION_LLM_MODEL=deepseek/deepseek-v4-pro
      - COGNITION_OPENAI_COMPATIBLE_BASE_URL=https://openrouter.ai/api/v1
      - COGNITION_OPENAI_COMPATIBLE_API_KEY=${COGNITION_OPENAI_COMPATIBLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Persistence — PostgreSQL
      - COGNITION_PERSISTENCE_BACKEND=postgres
      - COGNITION_PERSISTENCE_URI=postgresql+asyncpg://${POSTGRES_USER:-cognition}:${POSTGRES_PASSWORD:-cognition}@postgres:5432/${POSTGRES_DB:-cognition}

      # Sandbox — explicitly unsafe standalone development backend.
      # Commands execute inside this container, not in a production sandbox.
      # For isolated Docker sandbox execution, run Cognition on the host
      # with COGNITION_SANDBOX_BACKEND=docker instead.
      - COGNITION_SANDBOX_BACKEND=local
      - COGNITION_ALLOW_UNSAFE_LOCAL_EXECUTION=true
      - COGNITION_MCP_OUTBOUND_TRANSPORT_ENABLED=false
      - COGNITION_MCP_ALLOWED_ORIGINS=[]

      # Session Scoping — Multi-tenant isolation
      - COGNITION_SCOPING_ENABLED=true
      - COGNITION_SCOPE_KEYS=["user"]

      # OpenTelemetry — OTel Collector
      - COGNITION_TRACING_ENABLED=true
      - COGNITION_OTLP_ENDPOINT=http://otel-collector:4318
      - COGNITION_OTLP_MAX_EXPORT_BYTES=3670016
      - COGNITION_OTLP_QUEUE_SIZE=2048
      - COGNITION_OTLP_EXPORT_TIMEOUT_MS=30000
      - COGNITION_OTLP_METRIC_EXPORT_INTERVAL_MS=5000
      - COGNITION_TRACE_SAMPLE_RATIO=1.0
      - COGNITION_TRACE_DETAIL=standard
      # LangChain's native callback tree is converted to OTel on Cognition's
      # existing provider. OTEL_ONLY prevents a direct LangSmith export.
      - LANGSMITH_TRACING=true
      - LANGSMITH_OTEL_ENABLED=true
      - LANGSMITH_OTEL_ONLY=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_SERVICE_NAME=cognition
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOG_LEVEL=debug
      
      # ISSUE-007: AWS credentials for Bedrock - uid 1000 runs as cognition user
      - HOME=/home/cognition
      - AWS_PROFILE=${AWS_PROFILE:-default}
      # AWS_SESSION_TOKEN: pass through STS temporary credentials from CI/CD OIDC, aws sso, etc.
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      # COGNITION_BEDROCK_ROLE_ARN: if set, Cognition assumes this role via sts:AssumeRole.
      # Recommended for docker-compose: avoids mounting ~/.aws when using cross-account roles.
      - COGNITION_BEDROCK_ROLE_ARN=${COGNITION_BEDROCK_ROLE_ARN:-}
    volumes:
      - ./workspaces:/workspace
      - ./.cognition:/app/.cognition
      - ./.cognition:/workspace/.cognition
      - ./tests:/app/tests
      - mlflow-artifacts:/mlflow/artifacts
      # ISSUE-007: Mount AWS creds at cognition user's home (uid 1000), NOT /root
      - ~/.aws:/home/cognition/.aws:ro
    networks:
      - cognition-network
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Layer 7: Observability
  # ──────────────────────────────────────────────────────

  # MLflow - Experiment Tracking & Evaluation
  mlflow:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/mlflow/mlflow:v3.10.0
        RUN pip install --no-cache-dir psycopg2-binary
    container_name: cognition-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-cognition}:${POSTGRES_PASSWORD:-cognition}@postgres:5432/${POSTGRES_DB:-cognition}
      --default-artifact-root /mlflow/artifacts
      --disable-security-middleware
    ports:
      - "5050:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    networks:
      - cognition-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cognition-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cognition-network
    depends_on:
      - cognition
    restart: unless-stopped

  # Grafana - Dashboards and Visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: cognition-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - cognition-network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # OpenTelemetry Collector - Central trace collector
  # Receives OTel traces and fans out to MLflow (for eval/prompt registry)
  # and Grafana (for centralized observability)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: cognition-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    environment:
      - MLFLOW_EXPERIMENT_ID=${MLFLOW_EXPERIMENT_ID:-0}
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "9464:9464"     # Collector-exported OTel metrics for Prometheus
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    networks:
      - cognition-network
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: cognition-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - cognition-network
    restart: unless-stopped

  # Promtail - Log Shipping
  promtail:
    image: grafana/promtail:2.9.3
    container_name: cognition-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - cognition-network
    depends_on:
      - loki
    restart: unless-stopped

networks:
  cognition-network:
    driver: bridge

volumes:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
  loki-data:
